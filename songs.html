<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Songs | ALSBKIN</title>

  <meta
    name="description"
    content="Ascultă lansările ALSBKIN pe Spotify."
  />

  <meta
    name="robots"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  />

  <link rel="canonical" href="https://alsbkin.ro/songs.html" />

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/favicon-32x32.png"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Exo 2", sans-serif;
      background:
        radial-gradient(
          circle at top,
          rgba(143, 216, 255, 0.1),
          transparent 35%
        ),
        linear-gradient(180deg, #050505, #101010);
      color: #8fd8ff;
      text-align: center;
      min-height: 100vh;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.84);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #222;
    }

    nav a {
      color: #8fd8ff;
      text-decoration: none;
      margin: 0 12px;
      font-weight: 700;
      font-size: 14px;
      transition: 0.3s ease;
    }

    nav a:hover {
      color: #c00000;
    }

    main {
      width: min(1300px, 95%);
      margin: 0 auto;
      padding: 75px 0 90px;
    }

    h1 {
      margin: 0 0 45px;
      color: #ffffff;
      font-size: clamp(38px, 6vw, 64px);
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow:
        0 0 18px rgba(143, 216, 255, 0.38),
        0 0 38px rgba(143, 216, 255, 0.16);
    }

    .releases-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 35px;
      align-items: start;
    }

    .spotify-release {
      margin: 0;
      padding: 22px;
      background: #141414;
      border: 1px solid #292929;
      border-radius: 18px;
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.48),
        0 0 20px rgba(143, 216, 255, 0.08);
    }

    .spotify-release h2 {
      margin: 0 0 16px;
      color: #8fd8ff;
      font-size: 22px;
      font-weight: 700;
    }

    .spotify-release iframe {
      display: block;
      width: 100%;
      height: 152px;
      border: 0;
      border-radius: 12px;
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.45),
        0 0 18px rgba(29, 185, 84, 0.1);
    }

    footer {
      padding: 35px 20px;
      color: #8fd8ff;
      font-size: 14px;
      border-top: 1px solid #222;
    }

    @media (max-width: 900px) {
      .releases-grid {
        grid-template-columns: 1fr;
      }

      nav {
        padding: 10px 8px;
      }

      nav a {
        display: inline-block;
        margin: 6px 7px;
        font-size: 13px;
      }

      main {
        width: 94%;
        padding-top: 55px;
      }

      .spotify-release {
        padding: 16px;
      }

      .spotify-release h2 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">Acasă</a>
    <a href="songs.html">Songs</a>
    <a href="index.html#video">Video</a>
    <a href="index.html#despre">Despre</a>
    <a href="index.html#contact">Contact</a>
  </nav>

  <main>
    <h1>Songs</h1>

    <div class="releases-grid">

      <section class="spotify-release">
        <h2>Broken Wall (EDM Version)</h2>

        <iframe
          data-testid="embed-iframe"
          src="https://open.spotify.com/embed/album/7uTAwG68w6WGk2lHZhXCfm?utm_source=generator&si=b6e396a718e040c1"
          title="Broken Wall (EDM Version) — ALSBKIN"
          allowfullscreen
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      </section>

      <section class="spotify-release">
        <h2>Zidul spart (EDM Version)</h2>

        <iframe
          data-testid="embed-iframe"
          src="https://open.spotify.com/embed/album/1HDHB78UmpKBueZF5ETTos?utm_source=generator&si=6a57e842abed4202"
          title="Zidul spart (EDM Version) — ALSBKIN"
          allowfullscreen
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      </section>

      <section class="spotify-release">
        <h2>EDM Remixes July 2026</h2>

        <iframe
          data-testid="embed-iframe"
          src="https://open.spotify.com/embed/album/32gVs39fOr8A455ISqnTXD?utm_source=generator&si=4d88b9093e864657"
          title="EDM Remixes July 2026 — ALSBKIN"
          allowfullscreen
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      </section>

    </div>
  </main>

  <footer>
    © 2026 ALSBKIN. All rights reserved.
  </footer>

</body>
</html>
