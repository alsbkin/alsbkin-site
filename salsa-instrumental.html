    .songs-nav {
      position: relative;
      display: inline-block;
      padding: 15px 34px;
      font-family: "Exo 2", sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #ffffff;
      text-decoration: none;
      background: linear-gradient(135deg, #740000 0%, #d00000 45%, #ff3030 100%);
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 32px;
      box-shadow:
        0 5px 0 #530000,
        0 10px 20px rgba(0, 0, 0, 0.45),
        0 0 18px rgba(255, 0, 0, 0.7),
        0 0 42px rgba(255, 0, 0, 0.4);
      transform-style: preserve-3d;
      will-change: transform, box-shadow;
      animation:
        songsMove 6s ease-in-out infinite,
        songsPulse 1.25s ease-in-out infinite;
      z-index: 10;
    }

    .songs-nav::before {
      content: "";
      position: absolute;
      inset: -10px;
      z-index: -1;
      border: 2px solid rgba(255, 40, 40, 0.55);
      border-radius: 40px;
      box-shadow:
        0 0 18px rgba(255, 0, 0, 0.7),
        inset 0 0 18px rgba(255, 0, 0, 0.25);
      animation: songsHalo 1.5s ease-in-out infinite;
      pointer-events: none;
    }

    .songs-nav::after {
      content: "♫";
      position: absolute;
      top: -18px;
      right: -15px;
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      text-shadow:
        0 0 8px #ff0000,
        0 0 16px #ff0000,
        0 0 28px #ff3030;
      animation: musicNote 2.2s ease-in-out infinite;
      pointer-events: none;
    }

    .songs-nav:hover {
      color: #000000;
      background: linear-gradient(135deg, #f5c542, #fff2a0);
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow:
        0 5px 0 #9f7900,
        0 12px 26px rgba(0, 0, 0, 0.5),
        0 0 28px rgba(245, 197, 66, 0.95),
        0 0 60px rgba(245, 197, 66, 0.55);
      animation-play-state: paused;
      transform: scale(1.18) translateY(-5px);
    }

    @keyframes songsMove {
      0%, 100% { transform: translate(0, 0) rotate(-3deg); }
      20% { transform: translate(32px, -18px) rotate(3deg); }
      40% { transform: translate(-28px, -32px) rotate(-2deg); }
      60% { transform: translate(30px, 12px) rotate(4deg); }
      80% { transform: translate(-24px, -14px) rotate(-4deg); }
    }

    @keyframes songsPulse {
      0%, 100% {
        box-shadow:
          0 5px 0 #530000,
          0 10px 20px rgba(0, 0, 0, 0.45),
          0 0 14px rgba(255, 0, 0, 0.45),
          0 0 30px rgba(255, 0, 0, 0.25);

          0 12px 25px rgba(0, 0, 0, 0.5),
          0 0 30px rgba(255, 0, 0, 1),
          0 0 70px rgba(255, 0, 0, 0.75);
      }
    }

    @keyframes songsHalo {
      0%, 100% { opacity: 0.35; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.12); }
    }

    @keyframes musicNote {
      0% { opacity: 0; transform: translate(0, 8px) rotate(-10deg) scale(0.75); }
      25% { opacity: 1; }
      70% { opacity: 0.9; }
      100% { opacity: 0; transform: translate(15px, -28px) rotate(14deg) scale(1.25); }

<script>
    const versionButtons = document.querySelectorAll(".version-btn");
    const playerArea = document.getElementById("playerArea");
    const variantPlayers = document.getElementById("variantPlayers");

    versionButtons.forEach((button) => {
      const sources = (button.dataset.sources || "")
        .split("||")
        .map((source) => source.trim())
        .filter(Boolean);

      if (sources.length) {
        button.classList.add("has-player");
      }

      button.addEventListener("click", () => {
        if (!sources.length) return;

        versionButtons.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");

        variantPlayers.innerHTML = "";

        sources.forEach((source, index) => {
          const iframe = document.createElement("iframe");
          iframe.src = source;
          iframe.title = `${button.textContent.trim()} — ${index + 1} — ALSBKIN`;
          iframe.allow = "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
          iframe.loading = "lazy";
          iframe.setAttribute("allowfullscreen", "");
          variantPlayers.appendChild(iframe);
        });

        playerArea.style.display = "block";
        playerArea.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    });
</script>
