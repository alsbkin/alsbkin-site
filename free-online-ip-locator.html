function render(data){const values=[data.ip,data.type,data.country,data.region,data.city,data.postal,data.timezone?.id||data.timezone,data.connection?.isp||data.connection?.org||'',data.connection?.asn?`AS${data.connection.asn}`:'',data.latitude,data.longitude,data.continent];
